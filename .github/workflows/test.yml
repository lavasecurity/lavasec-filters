name: Catalog authorization tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
